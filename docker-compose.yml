services:
  bot:
    build: .
    env_file: .env

    volumes:
      # DMK_DB_DIR is the directory on *this host* that holds the campaign
      # database. It's always mounted at /data inside the container, so it can be
      # an absolute path (/mnt/sata/dmk/db) or a relative one (./local) and the
      # container doesn't care either way.
      - ${DMK_DB_DIR:-./local}:/data

    # Run as the host user that owns DMK_DB_DIR, otherwise SQLite can't write to
    # the mount. Find yours with `id -u` and `id -g`.
    user: "${DMK_UID:-1000}:${DMK_GID:-1000}"

    restart: unless-stopped
